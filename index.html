  const t=S.tasks.get(id);if(!t)return;
  const done=t.status!=='done',prev={status:t.status,doneAt:t.doneAt||''};
  if(row){row.classList.toggle('is-done',done);row.classList.remove('pop');void row.offsetWidth;row.classList.add('pop');const c=row.querySelector('.chk');if(c)c.setAttribute('aria-pressed',String(done));}
  haptic(done?15:8);
  patch('tasks',id,{status:done?'done':'todo',doneAt:done?todayStr():''},{delay:450});
  if(done)toast('Đã xong một việc',{undo:()=>patch('tasks',id,prev)});
}
function moveTomorrow(id){
  const t=S.tasks.get(id);if(!t)return;const prev=t.date;
  const base=isDate(t.date)&&t.date>=todayStr()?t.date:todayStr();
  patch('tasks',id,{date:addDays(base,1)},{delay:200});haptic(10);
  toast(`Đã dời sang ${fmtDay(addDays(base,1))}`,{undo:()=>patch('tasks',id,{date:prev})});
}
function toggleHabit(hid,date,btn){
  if(date>todayStr())return;
  const mk=date.slice(0,7),dd=date.slice(8);
  const doc=clone(S.habitlog.get(mk))||{month:mk,marks:{}};
  doc.marks=doc.marks||{};const hm=doc.marks[hid]||{};const on=!hm[dd];
  if(on)hm[dd]=true;else delete hm[dd];doc.marks[hid]=hm;
  if(btn){btn.classList.toggle('on',on);btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');}
  haptic(on?15:8);
  put('habitlog',mk,doc,{delay:300});
}
function copyMonth(){
  const mk=S.month,pk=addMonths(mk,-1);
  const src=[...S.goals.values()].filter(g=>g.level==='month'&&inR(g.start,monthStart(pk),monthEnd(pk))).sort(sortG);
  const taken=[];
  for(const g of src){const code=nextCode('month',taken);taken.push(code);const out=Object.assign(clone(g),{code,start:monthStart(mk),due:monthEnd(mk),status:'notstarted',created:Date.now(),updated:Date.now()});delete out.doneOn;if(out.metric)out.metric=Object.assign({},out.metric,{log:[]});put('goals',newId('g'),out,{silent:true});}
  schedule();toast(`Đã chép ${src.length} mục tiêu sang ${fmtMonth(mk).toLowerCase()}`);
}
function saveExp(){pref.set('exp',JSON.stringify([...S.exp]));}

let toastT=0,toastUndo=null;
function toast(msg,o={}){
  const t=$('#toast');toastUndo=o.undo||null;
  t.className=o==='err'||o.err?'err':'';
  t.innerHTML=`<span>${esc(msg)}</span>${toastUndo?'<button data-act="undo">Hoàn tác</button>':''}`;
  if(!toastUndo)t.style.paddingRight='16px';else t.style.paddingRight='';
  void t.offsetWidth;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show');toastUndo=null;},o==='err'?5000:toastUndo?4500:2400);
}

/* swipe a task: right = done, left = tomorrow */
const SWIPE=76;let sw=null,suppressClick=0;
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  const row=e.target.closest('.task[data-tid]');
  if(row&&!row.classList.contains('is-canc')){sw={kind:'task',row,body:row.querySelector('.t-body'),x0:e.clientX,y0:e.clientY,dx:0,on:false,pid:e.pointerId};return;}
  const strip=e.target.closest('#wstrip');
  if(strip)sw={kind:'strip',x0:e.clientX,y0:e.clientY,dx:0,on:false,pid:e.pointerId};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.pid)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.on){
    if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){sw=null;return;}
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){sw.on=true;if(sw.kind==='task'){sw.row.classList.add('sw');try{sw.row.setPointerCapture(e.pointerId);}catch(_){}}}
    else return;
  }
  sw.dx=dx;
  if(sw.kind!=='task')return;
  const lim=SWIPE*1.5,ad=Math.abs(dx),vis=ad>lim?Math.sign(dx)*(lim+(ad-lim)*.25):dx;
  sw.body.style.transform=`translate3d(${vis}px,0,0)`;
  sw.row.classList.toggle('dir-r',dx>0);sw.row.classList.toggle('dir-l',dx<0);
  const armed=ad>SWIPE;if(armed!==!!sw.armed){sw.armed=armed;sw.row.classList.toggle('armed',armed);if(armed)haptic(8);}
},{passive:true});
function endSwipe(e,cancel){
  if(!sw||(e&&e.pointerId!==sw.pid))return;
  const s=sw;sw=null;if(!s.on)return;
  suppressClick=Date.now();
  if(s.kind==='strip'){if(!cancel&&Math.abs(s.dx)>45)shiftWeek(s.dx<0?7:-7);return;}
  s.body.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';s.body.style.transform='';
  setTimeout(()=>{s.body.style.transition='';s.row.classList.remove('sw','armed','dir-l','dir-r');},250);
  if(!cancel&&Math.abs(s.dx)>SWIPE){const id=s.row.dataset.tid;if(s.dx>0)toggleTask(id,s.row);else moveTomorrow(id);}
}
document.addEventListener('pointerup',e=>endSwipe(e,false));
document.addEventListener('pointercancel',e=>endSwipe(e,true));
function shiftWeek(n){const sel=isDate(S.day)?S.day:todayStr();S.day=addDays(sel,n);haptic(6);schedule();}

document.addEventListener('click',e=>{
  if(Date.now()-suppressClick<350){e.preventDefault();e.stopPropagation();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,tid=b.closest('[data-tid]')?.dataset.tid,gid=b.dataset.gid||b.closest('[data-gid]')?.dataset.gid,hid=b.dataset.hid||b.closest('[data-hid]')?.dataset.hid;
  switch(act){
    case 'tab':switchTab(b.dataset.tab);break;
    case 'fab':if(S.tab==='goals')goalSheet(null,{level:'month'});else if(S.tab==='habits')habitSheet(null);else taskSheet(null,{date:isDate(S.day)?S.day:todayStr()});break;
    case 'settings':settingsSheet();break;
    case 'pick-day':S.day=b.dataset.d===todayStr()?null:b.dataset.d;haptic(5);schedule();break;
    case 'toggle':toggleTask(tid,b.closest('.task'));break;
    case 'edit-task':taskSheet(tid);break;
    case 'link':{const t=S.tasks.get(tid);if(t)pickGoal({current:t.goalId,title:t.title,onPick:g=>{patch('tasks',tid,{goalId:g});if(g)toast('Đã gắn mục tiêu');}});break;}
    case 'od-today':{const t=todayStr(),ids=D().overdue.map(x=>[x.id,x.date]);ids.forEach(([id])=>patch('tasks',id,{date:t},{silent:true}));schedule();haptic(12);toast(`Đã dời ${ids.length} việc sang hôm nay`,{undo:()=>{ids.forEach(([id,dt])=>patch('tasks',id,{date:dt},{silent:true}));schedule();}});break;}
    case 'od-cancel':
      if(!S.confirmOd){S.confirmOd=true;haptic(15);schedule();setTimeout(()=>{S.confirmOd=false;schedule();},4000);}
      else{S.confirmOd=false;const ids=D().overdue.map(x=>[x.id,x.status]);ids.forEach(([id])=>patch('tasks',id,{status:'cancelled'},{silent:true}));schedule();toast(`Đã huỷ ${ids.length} việc`,{undo:()=>{ids.forEach(([id,s])=>patch('tasks',id,{status:s},{silent:true}));schedule();}});}
      break;
    case 'od-toggle':S.odOpen=!S.odOpen;schedule();break;
    case 'hcheck':toggleHabit(hid,b.dataset.d,b);break;
    case 'edit-habit':habitSheet(hid);break;
    case 'edit-goal':goalSheet(gid);break;
    case 'exp':{if(S.exp.has(gid))S.exp.delete(gid);else S.exp.add(gid);saveExp();haptic(5);const c=b.closest('.gcard');if(c){c.classList.toggle('open',S.exp.has(gid));b.setAttribute('aria-expanded',String(S.exp.has(gid)));}break;}
    case 'add-sub':goalSheet(null,{parentId:gid});break;
    case 'add-task-goal':taskSheet(null,{goalId:gid,date:todayStr()});break;
    case 'new-goal':goalSheet(null,{level:b.dataset.level||'year'});break;
    case 'copy-month':copyMonth();break;
    case 'm-prev':case 'm-next':S.month=addMonths(S.month,act==='m-prev'?-1:1);haptic(5);schedule();break;
    case 'hw-prev':case 'hw-next':S.habWeek=addDays(weekStartOf(S.habWeek||todayStr(),weekStart()),act==='hw-prev'?-7:7);haptic(5);schedule();break;
    case 'rw-prev':case 'rw-next':S.revWeek=addDays(weekStartOf(S.revWeek||todayStr(),weekStart()),act==='rw-prev'?-7:7);schedule();break;
    case 'scope':S.scope=b.dataset.scope;pref.set('scope',S.scope);haptic(5);schedule();break;
    case 'backup':backup();break;
    case 'bk-snooze':pref.set('bk-snooze',todayStr());schedule();break;
    case 'import':$('#imp-file').click();break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;schedule();});}break;
    case 'inst-hide':pref.set('inst-hide','1');schedule();break;
    case 'undo':if(toastUndo){const f=toastUndo;toastUndo=null;f();$('#toast').classList.remove('show');haptic(8);}break;
    case 'tip':showTip(b);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheets.length){closeSheet();return;}
  if(e.key==='Enter'&&e.target.matches('.t-main')){e.preventDefault();taskSheet(e.target.closest('[data-tid]').dataset.tid);}
});
let tipT=0;
function showTip(b){const t=$('#tip');t.innerHTML=tips[+b.dataset.tip]||'';t.hidden=false;const r=b.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  t.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';t.style.top=Math.max(8,r.top-h-8)+'px';clearTimeout(tipT);tipT=setTimeout(()=>{t.hidden=true;},2600);}
addEventListener('scroll',()=>{$('#tip').hidden=true;},{passive:true});

/* theme + keyboard inset */
function applyTheme(){const th=S.settings.theme;if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);else document.documentElement.removeAttribute('data-theme');}
if(window.visualViewport){const vv=window.visualViewport;const f=()=>{const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',(kb>60?kb:0)+'px');};vv.addEventListener('resize',f);vv.addEventListener('scroll',f);}

/* install + offline */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;schedule();});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('Đã cài app');schedule();});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ask=w=>{const t=$('#toast');toastUndo=()=>w.postMessage('skip');t.className='';t.innerHTML='<span>Có bản cập nhật mới</span><button data-act="undo">Cập nhật</button>';t.classList.add('show');clearTimeout(toastT);};
    if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w);});});
    setInterval(()=>reg.update().catch(()=>{}),6*3600e3);
  }).catch(()=>{});
  let reloading=false;const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading||!hadController)return;reloading=true;flush();location.reload();});
}
setInterval(()=>{if(memo&&memo.today!==todayStr())schedule();},60000);

/* boot */
const had=load();
S.tab=['today','goals','habits','review'].includes(pref.get('tab','today'))?pref.get('tab','today'):'today';
try{const ex=JSON.parse(pref.get('exp','null'));if(Array.isArray(ex))S.exp=new Set(ex);else S.exp=new Set([...S.goals.values()].filter(g=>!g.parentId).map(g=>g.id));}catch(e){}
S.scope=pref.get('scope','month')==='all'?'all':'month';
render();
if(!had)setTimeout(welcomeSheet,250);
})();
</script>
